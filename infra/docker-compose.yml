version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: yol_postgres
    environment:
      POSTGRES_DB: yol_malumoti
      POSTGRES_USER: yol_user
      POSTGRES_PASSWORD: yol_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yol_user -d yol_malumoti"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yol_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: yol_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: yol_api
    environment:
      PORT: 4001
      NODE_ENV: production
      DATABASE_URL: postgresql://yol_user:yol_password@postgres:5432/yol_malumoti
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_change_in_prod
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: yol_web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
